name: draw keymap

on:
  workflow_dispatch:  # can be triggered manually
  push:               # automatically run on changes to following paths
    paths:
      - ".github/workflows/doc.yml"
      - "config/*.keymap"
      - "keymap_img/keymap_drawer.config.yaml"
      - "keymap_img/blueprint.yaml"
      - "keymap_img/temper-board.yaml"
      - "keymap_img/draw.py"

jobs:
  draw:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # allow the workflow to commit the drawings
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Parse the keymap
        run: uvx --from keymap-drawer keymap -c keymap_img/keymap_drawer.config.yaml parse -c 10 -z config/temper.keymap > keymap_img/temper.yaml
      - name: Draw the sheets
        run: uv run keymap_img/draw.py keymap_img/blueprint.yaml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "doc: update keymap image"
          file_pattern: "keymap_img/*.svg keymap_img/*.yaml"
