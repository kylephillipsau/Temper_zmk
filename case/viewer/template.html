<title>Short Temper Holster</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one drawing sheet. A frame, the model filling it, and a title strip along the bottom, like the keymap sheets. */
@font-face { font-family: Osifont; src: url(data:font/woff2;base64,/*FONT*/) format("woff2"); font-display: block; }
:root {
  --void: #000000;
  --trace: #ffffff;
  --rule: 2px;
  --hair: 1px;
  --lettering: Osifont, "DIN Alternate", "Bahnschrift", "Arial Narrow", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--void);
  color: var(--trace);
  font-family: var(--lettering);
  font-size: 17px;
  letter-spacing: 0.02em;
  padding-block: 12px;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
}
.sheet {
  height: 100%;
  min-height: 560px;
  border: var(--rule) solid var(--trace);
  display: grid;
  grid-template-rows: minmax(0, 1fr) auto;
}
.stage { position: relative; min-height: 0; overflow: hidden; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; outline-offset: -4px; }
canvas:active { cursor: grabbing; }
.callout {
  position: absolute; left: 0; top: 0;
  padding: 1px 6px;
  background: var(--void);
  border: var(--hair) solid var(--trace);
  font-size: 15px;
  white-space: nowrap;
  pointer-events: none;
}
.hint { position: absolute; left: 14px; top: 10px; font-size: 15px; pointer-events: none; }
.draft { position: absolute; right: 14px; top: 10px; font-size: 15px; pointer-events: none; }
.strip {
  border-top: var(--rule) solid var(--trace);
  display: grid;
  grid-template-columns: minmax(0, 1.25fr) auto minmax(0, 1fr);
}
.cell { padding: 12px 16px; min-width: 0; }
.cell + .cell { border-left: var(--hair) solid var(--trace); }
h1 { margin: 0; font-size: 30px; font-weight: 400; line-height: 1.1; text-wrap: balance; }
.lede { margin: 6px 0 0; line-height: 1.3; max-width: 46ch; }
.controls { display: grid; gap: 8px; align-content: center; }
.group { display: flex; gap: 6px; flex-wrap: wrap; }
button {
  font: inherit;
  letter-spacing: inherit;
  color: var(--trace);
  background: var(--void);
  border: 1.5px solid var(--trace);
  border-radius: 2.5px;
  padding: 5px 12px;
  cursor: pointer;
}
button[aria-pressed="true"] { background: var(--trace); color: var(--void); }
button:focus-visible, canvas:focus-visible { outline: 2px dashed var(--trace); outline-offset: 2px; }
dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 14px; margin: 0; align-content: center; height: 100%; }
dt, dd { margin: 0; line-height: 1.3; font-variant-numeric: tabular-nums; }
dd { text-align: right; }
.failed { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; line-height: 1.4; }
@media (max-width: 860px) {
  body { padding-block: 8px; }
  .sheet { height: auto; min-height: 0; grid-template-rows: 62vh auto; }
  .strip { grid-template-columns: minmax(0, 1fr); }
  .cell + .cell { border-left: 0; border-top: var(--hair) solid var(--trace); }
  h1 { font-size: 26px; }
  dl { height: auto; }
  .draft { top: auto; right: auto; left: 14px; bottom: 8px; }
  .callout { font-size: 13px; padding: 0 4px; }
}
</style>

<main class="sheet">
  <div class="stage" id="stage">
    <canvas id="view" tabindex="0" aria-label="3D model of the Short Temper keyboard and its thigh holster. Drag to rotate, and scroll or pinch to zoom."></canvas>
    <p class="hint" id="hint" style="margin:0">Drag to turn. Scroll to zoom.</p>
    <p class="draft" style="margin:0">Draft, not yet printed</p>
  </div>
  <div class="strip">
    <div class="cell">
      <h1>Short Temper Holster</h1>
      <p class="lede" id="lede"></p>
    </div>
    <div class="cell controls">
      <div class="group" role="group" aria-label="View">
        <button id="v-assembled" type="button">Assembled</button>
        <button id="v-exploded" type="button">Exploded</button>
        <button id="v-worn" type="button">Worn</button>
        <button id="v-fit" type="button">Test fit</button>
      </div>
      <div class="group" role="group" aria-label="Drawing style">
        <button id="s-lines" type="button">Lines</button>
        <button id="s-solid" type="button">Solid</button>
      </div>
    </div>
    <div class="cell">
      <dl>
        <dt>Holster</dt><dd id="size"></dd>
        <dt>Clip</dt><dd>80 mm below the pocket edge</dd>
        <dt>Clip grip</dt><dd id="force"></dd>
        <dt>Keyboard</dt><dd>Temper by raeedcho, 36 keys</dd>
      </dl>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
const MODEL = /*DATA*/;

(function () {
  const stage = document.getElementById('stage');
  const canvas = document.getElementById('view');
  const lede = document.getElementById('lede');
  const hint = document.getElementById('hint');
  document.getElementById('force').textContent = 'about ' + MODEL.facts.force + ' N in PETG';
  document.getElementById('size').textContent = MODEL.facts.size;
  if (window.matchMedia('(pointer: coarse)').matches) hint.textContent = 'Drag to turn. Pinch to zoom.';

  const VIEWS = {
    assembled: { text: 'The right half, seated in its holster. The keyboard lifts straight out for desk use.' },
    exploded: { text: 'A J-shaped clip bolts on behind the holster, with an optional steel spine sealed inside it.' },
    fit: { text: 'A thin slice of the holster to print first. It has the walls, lips, peg and latch, so you can try the keyboard in it.' },
    worn: { text: 'The clip goes over the pocket edge and runs straight down inside, with the keyboard turned 180 degrees to meet a hanging hand.' },
  };

  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  } catch (error) {
    const note = document.createElement('p');
    note.className = 'failed';
    note.textContent = 'This browser could not start WebGL, so the 3D model can\'t be shown. Try turning on hardware acceleration, or open this page in another browser.';
    stage.appendChild(note);
    return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x000000);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(28, 1, 5, 4000);
  const controls = new THREE.OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 120;
  controls.maxDistance = 1200;
  const calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  controls.autoRotate = !calm;
  controls.autoRotateSpeed = 0.6;
  controls.addEventListener('start', function () {
    controls.autoRotate = false;
    hint.hidden = true;
  });

  scene.add(new THREE.HemisphereLight(0xffffff, 0x303030, 0.75));
  const key = new THREE.DirectionalLight(0xffffff, 0.8);
  key.position.set(120, 220, 320);
  scene.add(key);

  function decode(text, Type) {
    const raw = atob(text);
    const bytes = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i += 1) bytes[i] = raw.charCodeAt(i);
    return new Type(bytes.buffer);
  }

  function geometry(part) {
    const packed = decode(part.position, Int16Array);
    const position = new Float32Array(packed.length);
    for (let i = 0; i < packed.length; i += 1) position[i] = packed[i] / MODEL.units;
    const shape = new THREE.BufferGeometry();
    shape.setAttribute('position', new THREE.BufferAttribute(position, 3));
    shape.setIndex(new THREE.BufferAttribute(decode(part.index, Uint32Array), 1));
    return shape;
  }

  // Each part: which group it moves with, and its grey in the solid style
  const GROUPS = {
    keyboard: { move: [0, 0, 70], label: 'Keyboard, in its own case', parts: { case: 0x2a2a2a, caps: 0x3c3c3c, stems: 0x1a1a1a, pcb: 0x141414, usb: 0xb8b8b8, chips: 0x202020 } },
    holster: { move: [0, 0, 0], label: 'Holster', parts: { holster: 0x8f8f8f } },
    fit: { move: [0, 0, 0], label: 'Test fit', only: true, parts: { fit: 0x9a9a9a } },
    screws: { move: [0, 0, -30], label: 'M3 screws', parts: { screws: 0xd0d0d0 } },
    clip: { move: [0, 0, -62], label: 'Pocket clip', parts: { clip: 0xc4c4c4 } },
    spine: { move: [0, -38, -92], label: 'Steel spine', parts: { spine: 0xf0f0f0 } },
  };

  const rig = new THREE.Group();
  scene.add(rig);
  const filled = [];
  const lined = [];
  const blackFill = new THREE.MeshBasicMaterial({ color: 0x000000, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
  const whiteLine = new THREE.LineBasicMaterial({ color: 0xffffff });

  Object.keys(GROUPS).forEach(function (name) {
    const entry = GROUPS[name];
    entry.node = new THREE.Group();
    rig.add(entry.node);
    Object.keys(entry.parts).forEach(function (partName) {
      const shape = geometry(MODEL.parts[partName]);
      shape.computeVertexNormals();
      const solid = new THREE.MeshStandardMaterial({ color: entry.parts[partName], roughness: 0.72, metalness: 0.05, flatShading: true });
      const mesh = new THREE.Mesh(shape, blackFill);
      mesh.userData.solid = solid;
      entry.node.add(mesh);
      filled.push(mesh);
      const lines = new THREE.LineSegments(new THREE.EdgesGeometry(shape, 24), whiteLine);
      entry.node.add(lines);
      lined.push(lines);
    });
    const box = new THREE.Box3().setFromObject(entry.node);
    entry.anchor = box.getCenter(new THREE.Vector3());
    entry.anchor.y = box.max.y;
    const tag = document.createElement('span');
    tag.className = 'callout';
    tag.textContent = entry.label;
    tag.hidden = true;
    stage.appendChild(tag);
    entry.tag = tag;
  });

  // A patch of the thigh curve, for the worn view
  const thigh = new THREE.Group();
  const curve = [];
  const arc = 1.15;
  for (let y = -190; y <= 190; y += 38) {
    for (let i = 0; i < 48; i += 1) {
      const a = -arc + (2 * arc * i) / 48;
      const b = -arc + (2 * arc * (i + 1)) / 48;
      curve.push(Math.sin(a) * MODEL.leg.r, y, Math.cos(a) * MODEL.leg.r, Math.sin(b) * MODEL.leg.r, y, Math.cos(b) * MODEL.leg.r);
    }
  }
  for (let i = 0; i <= 8; i += 1) {
    const a = -arc + (2 * arc * i) / 8;
    curve.push(Math.sin(a) * MODEL.leg.r, -190, Math.cos(a) * MODEL.leg.r, Math.sin(a) * MODEL.leg.r, 190, Math.cos(a) * MODEL.leg.r);
  }
  // The pocket edge, where the top of the clip sits
  // It drops towards the back of the leg, which is the left of this view
  const edgeSlope = Math.tan(THREE.MathUtils.degToRad(MODEL.leg.slant));
  const edgeMiddle = -MODEL.leg.clipW / MODEL.leg.r;
  const edgeY = function (angle) { return -MODEL.leg.edge + MODEL.leg.r * (angle - edgeMiddle) * edgeSlope; };
  const edge = [];
  for (let i = 0; i < 32; i += 1) {
    const a = edgeMiddle - 0.55 + (1.1 * i) / 32;
    const b = edgeMiddle - 0.55 + (1.1 * (i + 1)) / 32;
    edge.push(Math.sin(a) * MODEL.leg.r, edgeY(a), Math.cos(a) * MODEL.leg.r, Math.sin(b) * MODEL.leg.r, edgeY(b), Math.cos(b) * MODEL.leg.r);
  }
  const edgeShape = new THREE.BufferGeometry();
  edgeShape.setAttribute('position', new THREE.Float32BufferAttribute(edge, 3));
  thigh.add(new THREE.LineSegments(edgeShape, whiteLine));
  const edgeTag = document.createElement('span');
  edgeTag.className = 'callout';
  edgeTag.textContent = 'Pocket edge';
  edgeTag.hidden = true;
  stage.appendChild(edgeTag);
  const edgeLabelAt = edgeMiddle - 0.5;
  const edgePoint = new THREE.Vector3(Math.sin(edgeLabelAt) * MODEL.leg.r, edgeY(edgeLabelAt), Math.cos(edgeLabelAt) * MODEL.leg.r);

  const thighShape = new THREE.BufferGeometry();
  thighShape.setAttribute('position', new THREE.Float32BufferAttribute(curve, 3));
  const thighLines = new THREE.LineSegments(thighShape, new THREE.LineDashedMaterial({ color: 0xffffff, dashSize: 3, gapSize: 5 }));
  thighLines.computeLineDistances();
  thigh.add(thighLines);
  scene.add(thigh);

  const centre = new THREE.Box3().setFromObject(rig).getCenter(new THREE.Vector3());
  const tilt = THREE.MathUtils.degToRad(MODEL.leg.tilt);
  const pivot = new THREE.Vector3(MODEL.leg.x, MODEL.leg.y, MODEL.leg.z);

  // The poses each view eases towards
  function pose(view) {
    if (view === 'worn') {
      const turn = Math.PI + tilt;
      const moved = pivot.clone().applyAxisAngle(new THREE.Vector3(0, 0, 1), turn).negate();
      const onLeg = centre.clone().applyAxisAngle(new THREE.Vector3(0, 0, 1), turn).add(moved);
      return { spin: turn, at: moved, explode: 0, leg: 1, target: onLeg, eye: new THREE.Vector3(-300, 110, 460) };
    }
    const explode = view === 'exploded' ? 1 : 0;
    return {
      spin: 0,
      at: centre.clone().negate(),
      explode,
      leg: 0,
      target: new THREE.Vector3(0, 0, explode ? -18 : 0),
      eye: view === 'fit' ? new THREE.Vector3(90, -170, 250) : explode ? new THREE.Vector3(390, 200, 150) : new THREE.Vector3(105, -95, 275),
    };
  }

  let view = 'assembled';
  let style = 'lines';
  let goal = pose(view);
  const now = { spin: 0, at: goal.at.clone(), explode: 0, leg: 0 };
  let easingCamera = true;

  function press(prefix, chosen, names) {
    names.forEach(function (name) {
      document.getElementById(prefix + name).setAttribute('aria-pressed', String(name === chosen));
    });
  }

  function setView(name, fromHash) {
    view = name;
    goal = pose(name);
    easingCamera = true;
    press('v-', name, ['assembled', 'exploded', 'worn', 'fit']);
    Object.keys(GROUPS).forEach(function (group) {
      GROUPS[group].node.visible = Boolean(GROUPS[group].only) === (name === 'fit');
    });
    lede.textContent = VIEWS[name].text;
    if (!fromHash) {
      try { history.replaceState(null, '', '#' + name); } catch (error) { /* the address can't change here, and that's fine */ }
    }
  }

  function setStyle(name) {
    style = name;
    press('s-', name, ['lines', 'solid']);
    filled.forEach(function (mesh) { mesh.material = name === 'solid' ? mesh.userData.solid : blackFill; });
    lined.forEach(function (lines) { lines.visible = name === 'lines'; });
  }

  ['assembled', 'exploded', 'worn', 'fit'].forEach(function (name) {
    document.getElementById('v-' + name).addEventListener('click', function () { setView(name); });
  });
  ['lines', 'solid'].forEach(function (name) {
    document.getElementById('s-' + name).addEventListener('click', function () { setStyle(name); });
  });
  window.addEventListener('hashchange', function () {
    const name = location.hash.slice(1);
    if (VIEWS[name]) setView(name, true);
  });

  function resize() {
    const width = stage.clientWidth;
    const height = stage.clientHeight;
    renderer.setSize(width, height, false);
    camera.aspect = width / height;
    // Pull back on narrow screens, so the whole model stays in frame
    camera.fov = width < height ? 56 : 28;
    camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(stage);
  resize();

  const start = location.hash.slice(1);
  setView(VIEWS[start] ? start : 'assembled', true);
  setStyle('lines');
  camera.position.copy(goal.eye);
  controls.target.copy(goal.target);

  const place = new THREE.Vector3();
  function frame() {
    requestAnimationFrame(frame);
    const ease = calm ? 1 : 0.09;
    now.spin += (goal.spin - now.spin) * ease;
    now.explode += (goal.explode - now.explode) * ease;
    now.leg += (goal.leg - now.leg) * ease;
    now.at.lerp(goal.at, ease);
    rig.rotation.z = now.spin;
    rig.position.copy(now.at);
    thigh.visible = now.leg > 0.5;
    Object.keys(GROUPS).forEach(function (name) {
      const entry = GROUPS[name];
      entry.node.position.set(entry.move[0] * now.explode, entry.move[1] * now.explode, entry.move[2] * now.explode);
    });
    if (easingCamera) {
      camera.position.lerp(goal.eye, ease);
      controls.target.lerp(goal.target, ease);
      if (camera.position.distanceTo(goal.eye) < 1) easingCamera = false;
    }
    controls.update();
    renderer.render(scene, camera);

    edgeTag.hidden = !(view === 'worn' && now.leg > 0.9);
    if (!edgeTag.hidden) {
      place.copy(edgePoint).project(camera);
      edgeTag.style.transform = 'translate(' + Math.round(Math.max(6, (place.x * 0.5 + 0.5) * stage.clientWidth - edgeTag.offsetWidth / 2)) + 'px,' + Math.round((-place.y * 0.5 + 0.5) * stage.clientHeight - 30) + 'px)';
    }
    const labels = view === 'exploded' && now.explode > 0.9;
    Object.keys(GROUPS).forEach(function (name) {
      const entry = GROUPS[name];
      entry.tag.hidden = !labels || entry.only === true;
      if (entry.tag.hidden) return;
      place.copy(entry.anchor).applyMatrix4(entry.node.matrixWorld).project(camera);
      const x = (place.x * 0.5 + 0.5) * stage.clientWidth;
      const y = (-place.y * 0.5 + 0.5) * stage.clientHeight;
      const left = Math.max(6, Math.min(x - entry.tag.offsetWidth / 2, stage.clientWidth - entry.tag.offsetWidth - 6));
      entry.tag.style.transform = 'translate(' + Math.round(left) + 'px,' + Math.round(y - 30) + 'px)';
    });
  }
  frame();
})();
</script>
